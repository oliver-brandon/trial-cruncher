name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run every supported OS and Python combination
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_matrix:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.full_matrix || false }}
  cancel-in-progress: ${{ !inputs.full_matrix }}

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu"

jobs:
  routine:
    if: ${{ !inputs.full_matrix }}
    name: Routine tests (${{ matrix.os }}, ${{ matrix.python-version }})
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            webengine: "1"
            paths: tests
          - os: ubuntu-latest
            python-version: "3.14"
            webengine: "0"
            paths: >-
              tests/test_core.py tests/test_medpc.py tests/test_prl_metrics.py
              tests/test_phase_metrics.py tests/test_partial_sessions.py
              tests/test_aggregation.py tests/test_projects.py tests/test_exporters.py
              tests/test_excel.py tests/test_compact_export.py
              tests/test_compact_excel.py
          - os: windows-latest
            python-version: "3.12"
            webengine: "1"
            paths: &native-tests >-
              tests/test_excel.py tests/test_exporters.py tests/test_compact_excel.py
              tests/test_compact_export.py tests/test_export_folder_names.py
              tests/test_projects.py tests/test_project_gui.py tests/test_overview.py
              tests/test_phase_overview.py tests/test_web_shell.py
              tests/test_web_workflow.py tests/test_simple_workflow.py
              tests/test_web_jobs.py tests/test_web_column_resize.py
              tests/test_web_assignments.py tests/test_web_data.py
              tests/test_metadata_gui.py tests/test_animal_analysis_gui.py
              tests/test_assignment_selection.py tests/test_analysis_project_parity.py
              tests/test_updates.py
          - os: macos-latest
            python-version: "3.12"
            webengine: "1"
            paths: *native-tests
    env:
      TRIAL_CRUNCHER_WEBENGINE_TESTS: ${{ matrix.webengine }}
      TEST_PATHS: ${{ matrix.paths }}
    steps: &check-steps
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libnss3
      - run: python -m pip install -e '.[test]'
      - name: Lint
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: ruff check .
      - name: Check formatting
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: ruff format --check .
      - name: Test
        run: python -m pytest -vv --timeout=90 --timeout-method=thread ${{ env.TEST_PATHS }}

  full:
    if: ${{ inputs.full_matrix }}
    name: Full tests (${{ matrix.os }}, ${{ matrix.python-version }})
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    env:
      TRIAL_CRUNCHER_WEBENGINE_TESTS: "1"
      TEST_PATHS: tests
    steps: *check-steps
