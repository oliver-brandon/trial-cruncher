[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "trial-cruncher"
dynamic = ["version"]
description = "From raw trials to analysis-ready data."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Brandon Oliver"}]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
    "packaging>=24",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7", "velopack==1.2.0"]
matlab = ["scipy>=1.13", "h5py>=3.11"]
test = ["pytest>=8.3", "pytest-timeout>=2.3", "ruff>=0.9"]

[project.scripts]
trial-cruncher = "trial_cruncher.cli:main"

[project.gui-scripts]
trial-cruncher-gui = "trial_cruncher.gui.app:main"

[tool.hatch.version]
path = "src/trial_cruncher/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/trial_cruncher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
